<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ECE Rankings</title>
  <meta name="description" content="A metrics-based ranking of Electrical & Computer Engineering programs worldwide." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  
  <div class="app-layout">
    
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
          ECE Rankings
        </div>
      </div>

      <div class="sidebar-content">
        <!-- Region Filter -->
        <div class="filter-section">
          <label class="filter-label">Region</label>
          <div class="select-wrapper">
            <select id="region-filter" class="clean-select">
              <option value="all">Global</option>
              <option value="us">United States</option>
              <option value="ca">Canada</option>
              <option value="north-america">North America</option>
              <option value="europe">Europe</option>
              <option value="asia">Asia</option>
              <option value="oceania">Oceania</option>
            </select>
            <svg class="select-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>

        <!-- Time Horizon Dual Slider -->
        <div class="filter-section">
          <div class="filter-header-flex">
            <label class="filter-label">Time Horizon</label>
            <div class="year-display">
              <span id="display-start">2016</span> - <span id="display-end">2026</span>
            </div>
          </div>
          
          <div class="double-slider-container">
            <div class="slider-track" id="slider-track"></div>
            <input type="range" id="year-min" min="2000" max="2026" value="2016" class="range-input" />
            <input type="range" id="year-max" min="2000" max="2026" value="2026" class="range-input" />
          </div>
        </div>

        <!-- Research Domains (Pills) -->
        <div class="filter-section">
          <div class="filter-header-flex">
            <label class="filter-label">Research Domains</label>
            <button id="toggle-all-areas" class="btn-link">Toggle All</button>
          </div>
          <div id="areas-container" class="domains-container">
            <!-- Dynamically populated -->
          </div>
        </div>
      </div>
      
      <div class="sidebar-footer">
        <a href="#">Methodology</a>
        <a href="https://github.com/edwardding/ecerankings.org" target="_blank">GitHub</a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="main-header">
        <div class="header-titles">
          <h1>Institution Rankings</h1>
          <p id="results-count">Loading data...</p>
        </div>
        <div class="header-actions">
          <button class="btn-primary" onclick="window.print()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
            Export
          </button>
        </div>
      </header>

      <div class="table-card">
        <table class="clean-table">
          <thead>
            <tr>
              <th class="col-rank">Rank</th>
              <th class="col-inst">Institution</th>
              <th class="col-score">Geo Mean Score</th>
            </tr>
          </thead>
          <tbody id="ranking-tbody">
            <!-- Rows injected here -->
          </tbody>
        </table>
      </div>
    </main>

  </div>

  <div id="loading-overlay" class="loading-overlay active">
    <div class="spinner"></div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
