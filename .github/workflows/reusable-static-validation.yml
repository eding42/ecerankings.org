name: Reusable static project validation
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '22'
      use-lfs:
        type: boolean
        default: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: ${{ inputs.use-lfs }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
